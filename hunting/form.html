<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/hunting_logo.svg" type="image/svg+xml">
    <title>Ask a Question | Hunting Basics</title>
    <meta name="description" content="Send a beginner hunting question through the contact form.">
    <meta name="author" content="Emmanuel Garcia">

    <meta property="og:title" content="Ask a Question | Hunting Basics">
    <meta property="og:description" content="Send a beginner hunting question through the contact form.">
    <meta property="og:image" content="https://raagnaa.github.io/wdd231/hunting/images/hero.webp">
    <meta property="og:url" content="https://raagnaa.github.io/wdd231/hunting/form.html">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">

    <script src="scripts/menu.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <div class="header-inner">
            <a class="logo" href="index.html">
                <img src="images/hunting_logo.svg" alt="Hunting Basics logo" width="42" height="42">
                Hunting Basics
            </a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
            <nav id="main-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="techniques.html">Techniques</a></li>
                    <li><a href="safety.html">Safety and Equipment</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-banner">
            <h1>Ask a Question</h1>
        </div>
        <p class="intro-text">New to hunting? Send a question and I will try to answer when I can.</p>

        <section class="form-section">
            <form action="form-response.html" method="get" id="contact-form">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" autocomplete="given-name" title="First Name" required>

                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" autocomplete="family-name" title="Last Name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" title="Email" required>

                <label for="experience">Hunting Experience</label>
                <select id="experience" name="experience" title="Hunting Experience" required>
                    <option value="">Choose one</option>
                    <option value="never">Never hunted</option>
                    <option value="once">Once or twice</option>
                    <option value="learning">Still learning</option>
                </select>

                <label for="question">Your Question</label>
                <textarea id="question" name="question" rows="5" title="Your Question" required></textarea>

                <input type="hidden" id="timestamp" name="timestamp" value="">

                <input type="submit" value="Send Question">
            </form>
        </section>
    </main>

    <footer>
        <p>Emmanuel Garcia | WDD 231</p>
        <p>&copy; <span id="year"></span> Hunting Basics</p>
        <p>
            <a href="attributions.html">Attributions</a> ·
            <a href="form.html">Ask a Question</a> ·
            <a href="video.html">Project Video</a>
        </p>
    </footer>
</body>

</html>
